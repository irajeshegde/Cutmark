<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AudioSlice: cut, split and time-mark audio in your browser</title>
    <meta name="description" content="Cut, split, trim and time-mark MP3, WAV, M4A and other audio files entirely in your browser. No uploads, no account, no server." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://audio-slice.vercel.app/" />
    <meta property="og:title" content="AudioSlice: cut, split and time-mark audio in your browser" />
    <meta property="og:description" content="Cut, split, trim and time-mark MP3, WAV, M4A and other audio files entirely in your browser. No uploads, no account, no server." />
    <meta property="og:image" content="https://audio-slice.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AudioSlice: cut, split and time-mark audio in your browser" />
    <meta name="twitter:description" content="Cut, split, trim and time-mark MP3, WAV, M4A and other audio files entirely in your browser. No uploads, no account, no server." />
    <meta name="twitter:image" content="https://audio-slice.vercel.app/og-image.png" />

    <!-- Apply the saved theme before first paint so there is no flash. Key matches src/brand.ts slug. -->
    <script>
      try {
        var t = localStorage.getItem('audioslice-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AudioSlice needs JavaScript: all audio processing happens in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
